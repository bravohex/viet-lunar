name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4

      - name: Confirm Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Verify source and functional test suite
        run: |
          ./scripts/verify_reference_data.sh
          ./scripts/test.sh --skip-performance

      - name: Import Developer ID certificate
        id: signing
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in \
            DEVELOPER_ID_CERTIFICATE_BASE64 \
            DEVELOPER_ID_CERTIFICATE_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error title=Missing release secret::${secret_name} must be configured."
              exit 1
            fi
          done

          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/vietlunar-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          if ! printf '%s' "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"; then
            rm -f "$certificate_path"
            echo "::error title=Invalid certificate Base64::Recreate DEVELOPER_ID_CERTIFICATE_BASE64 from the exported .p12 file. Paste only the Base64 text, without a data: prefix, quotes, or Markdown fences."
            exit 1
          fi
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' |
              head -n 1
          )"
          if [[ -z "$signing_identity" ]]; then
            echo "::error title=Developer ID certificate not found::Import a Developer ID Application certificate with its private key."
            exit 1
          fi

          echo "identity=$signing_identity" >> "$GITHUB_OUTPUT"

      - name: Archive a signed universal Release app
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          xcodebuild \
            -quiet \
            -project VietLunar.xcodeproj \
            -scheme VietLunar \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/VietLunar.xcarchive" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            clean archive

      - name: Verify signed archive and version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          app_path="$RUNNER_TEMP/VietLunar.xcarchive/Products/Applications/VietLunar.app"
          info_plist="$app_path/Contents/Info.plist"
          version="$(plutil -extract CFBundleShortVersionString raw "$info_plist")"

          [[ "$(plutil -extract CFBundleIdentifier raw "$info_plist")" == "com.bravohex.vietlunar" ]]
          [[ "$RELEASE_TAG" == "v$version" ]]
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -d --entitlements :- "$app_path" > "$RUNNER_TEMP/VietLunar.entitlements.plist"
          python3 scripts/verify_release_entitlements.py "$RUNNER_TEMP/VietLunar.entitlements.plist"
          lipo -archs "$app_path/Contents/MacOS/VietLunar" | grep -E '^arm64 x86_64$|^x86_64 arm64$'

      - name: Create notarization archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/VietLunar.xcarchive/Products/Applications/VietLunar.app" \
            "$RUNNER_TEMP/VietLunar-notarization.zip"

      - name: Notarize app
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          for secret_name in \
            NOTARY_KEY_ID \
            NOTARY_ISSUER_ID \
            NOTARY_PRIVATE_KEY_BASE64; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error title=Missing release secret::${secret_name} must be configured."
              exit 1
            fi
          done

          notary_key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          trap 'rm -f "$notary_key_path"' EXIT
          printf '%s' "$NOTARY_PRIVATE_KEY_BASE64" | base64 -D > "$notary_key_path"
          xcrun notarytool submit "$RUNNER_TEMP/VietLunar-notarization.zip" \
            --key "$notary_key_path" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait

      - name: Staple and assess notarized app
        run: |
          set -euo pipefail

          stapler_with_retry() {
            local action="$1" app="$2"
            local attempt=1 delay=10 output exit_code
            while true; do
              if output="$(xcrun stapler "$action" "$app" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              else
                exit_code=$?
              fi
              printf '%s\n' "$output" >&2

              # Exit 68 alone can mean an invalid ticket. Only retry a confirmed
              # dropped connection to Apple's ticket service, never bypass validation.
              if [[ "$attempt" -ge 4 ]] ||
                 ! grep -Eq 'NSURLErrorDomain Code=-1005([^0-9]|$)' <<< "$output"; then
                return "$exit_code"
              fi
              echo "::warning::stapler $action lost its connection; retrying in ${delay}s (attempt $((attempt + 1))/4)."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          app_path="$RUNNER_TEMP/VietLunar.xcarchive/Products/Applications/VietLunar.app"
          stapler_with_retry staple "$app_path"
          stapler_with_retry validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

      - name: Package release archive and checksum
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive_name="VietLunar-${RELEASE_TAG}-macos-universal.zip"
          archive_path="$RUNNER_TEMP/$archive_name"

          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/VietLunar.xcarchive/Products/Applications/VietLunar.app" \
            "$archive_path"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$archive_name") > "$archive_path.sha256"

          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
        run: |
          assets=(
            "$RUNNER_TEMP/$ARCHIVE_NAME"
            "$RUNNER_TEMP/$ARCHIVE_NAME.sha256"
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "VietLunar $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/vietlunar-signing.keychain-db" || true
