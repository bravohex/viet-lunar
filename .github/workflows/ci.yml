name: macOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            Tools/Holidays/package-lock.json
            Tools/Icons/package-lock.json

      - name: Verify Lucide assets
        working-directory: Tools/Icons
        run: |
          npm ci
          npm run check

      - name: Verify bundled holiday data
        working-directory: Tools/Holidays
        run: |
          npm ci
          npm test
          npm run check

      - name: Confirm Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Validate repository scripts
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          ruby -c Tools/ProjectGenerator/generate_project.rb

      - name: Verify reference data
        run: ./scripts/verify_reference_data.sh

      - name: Build and run functional tests (excluding performance measurement)
        run: ./scripts/test.sh --skip-performance

      - name: Build an unsigned universal Release app
        run: |
          xcodebuild \
            -quiet \
            -project VietLunar.xcodeproj \
            -scheme VietLunar \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath .build/CIDerivedData \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          lipo -archs .build/CIDerivedData/Build/Products/Release/VietLunar.app/Contents/MacOS/VietLunar | \
            grep -E '^arm64 x86_64$|^x86_64 arm64$'
